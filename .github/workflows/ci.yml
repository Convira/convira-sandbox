name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Without bwrap the Linux adapter resolves to passthrough, the integration
      # cases skip, and this leg goes green having exercised no confinement at
      # all. Installing it is what makes the Linux tick mean what a reader
      # assumes it means.
      - name: Install bubblewrap (Linux confinement backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 ships an AppArmor profile that permits bwrap's user
          # namespace but withholds CAP_NET_ADMIN inside it, so `--unshare-net`
          # creates the namespace and then dies configuring loopback:
          # "Failed RTM_NEWADDR: Operation not permitted". This restores the
          # kernel default the sandbox is written against. It relaxes the
          # RUNNER, never the sandbox - the confinement under test is the same
          # code either way, and this is what lets it be tested at all.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
